[package]
name = "altonic"
version = "0.1.0"
edition = "2021"
description = "Pure-Rust database data cleaning (de-identification), subsetting, and replication tool"
license = "MIT"

[dependencies]
hex = "0.4.3"
hmac = "0.13.0"
postgres = "0.19.14"
rand = "0.10.2"
rand_distr = "0.6.0"
rand_xoshiro = "0.8.1"
regex = "1.13.1"
serde = "1.0.229"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
toml = { version = "1.1.4", features = ["preserve_order"] }
url = "2.5.8"

[lib]
name = "altonic"
path = "src/lib.rs"

[[bin]]
name = "altonic"
path = "src/main.rs"

[profile.release]
lto = true
